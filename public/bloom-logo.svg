<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for crisp strokes and gradients if needed -->
  <defs>
    <!-- Soft background card squircle (like logo1) -->
    <filter id="bloomShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Flower + Bloom Text Group -->
  <g id="bloom-logo-group">
    <!-- 8 Petals arranged precisely around (250, 195) -->
    <!-- The colors in clockwise sequence starting from top-left:
         1. Top-Left / Left of Top: Sky Blue (#7ec5f5)
         2. Top-Right / Right of Top: Mint Green (#7fedb2)
         3. Upper Right: Soft Pink (#fa9dc6)
         4. Lower Right: Lavender Purple (#b7b8f9)
         5. Bottom-Right: Sky Blue (#7ec5f5)
         6. Bottom-Left: Mint Green (#7fedb2)
         7. Lower Left: Soft Pink (#fa9dc6)
         8. Upper Left: Lavender Purple (#b7b8f9)
    -->

    <!-- Petal 1: Top-Left (Sky Blue, angle -22.5 deg) -->
    <path d="M 233 145 C 230 65, 205 60, 222 135 Z" fill="#7ec5f5" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="rotate(-22.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#7ec5f5" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Petal 2: Top-Right (Mint Green, angle 22.5 deg) -->
    <g transform="rotate(22.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#7fedb2" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Petal 3: Upper-Right (Pink, angle 67.5 deg) -->
    <g transform="rotate(67.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#fa9dc6" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Petal 4: Lower-Right (Lavender, angle 112.5 deg) -->
    <g transform="rotate(112.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#b7b8f9" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Petal 5: Bottom-Right (Sky Blue, angle 157.5 deg) -->
    <g transform="rotate(157.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#7ec5f5" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Petal 6: Bottom-Left (Mint Green, angle 202.5 deg) -->
    <g transform="rotate(202.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#7fedb2" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Petal 7: Lower-Left (Pink, angle 247.5 deg) -->
    <g transform="rotate(247.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#fa9dc6" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Petal 8: Upper-Left (Lavender, angle 292.5 deg) -->
    <g transform="rotate(292.5 250 195)">
      <path d="M 235 150 C 230 60, 270 60, 265 150 Z" fill="#b7b8f9" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Center Yellow Smiley Disk -->
    <circle cx="250" cy="195" r="54" fill="#fae486" stroke="#262626" stroke-width="5" />

    <!-- Smiling Face Features inside Yellow Circle -->
    <!-- Left Eye (arc / happy squint) -->
    <path d="M 226 182 C 228 177, 236 177, 238 182" fill="none" stroke="#262626" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Right Eye (arc / happy squint) -->
    <path d="M 262 182 C 264 177, 272 177, 274 182" fill="none" stroke="#262626" stroke-width="4.5" stroke-linecap="round" />

    <!-- Happy Smile -->
    <path d="M 226 200 C 233 226, 267 226, 274 200" fill="none" stroke="#262626" stroke-width="4.5" stroke-linecap="round" />

    <!-- "Bloom" Brand Typography below the flower -->
    <!-- Sweet rounded friendly bubble font -->
    <g id="bloom-text">
      <text x="250" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#fa85bb" letter-spacing="1.5">Bloom</text>
    </g>
  </g>
</svg>
